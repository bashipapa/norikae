name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest には Android SDK が入っている（ANDROID_HOME が設定済み）
      - name: Test and build
        run: ./gradlew :core:test :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: norikae-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # スマホから直接ダウンロードできるよう、Releases の「latest」に APK を置く
      - name: Publish to Releases (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk norikae.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest norikae.apk \
            --title "最新版（${GITHUB_SHA::7}）" \
            --notes "main の最新コミットからビルドしたAPK。スマホでこのページを開き norikae.apk をタップしてインストール。" \
            --target "$GITHUB_SHA"
